<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aSiKuRT</title>
<meta name="description" content="aSiKuRT - araçlar, kaynaklar ve hızlı erişim başlangıç sayfası">
<meta name="theme-color" content="#090d12">
<style>
:root{--bg:#060d1b;--panel:#0b1a2e;--panel2:#112a46;--line:#1d3b61;--gold:#22b8cf;--gold2:#67e8f9;--txt:#f2f2f2;--mut:#9aa0a6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex;overflow:hidden}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.22;z-index:0;pointer-events:none}
aside{position:relative;z-index:30;width:270px;flex:none;background:#07142a;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;transition:margin .25s,transform .25s}
body.nav-closed aside{margin-left:-270px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--gold);padding:4px 8px 18px}
.brand svg{width:34px;height:34px}
nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;color:#c9ccd0;text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:4px;transition:.15s}
nav a:hover{background:var(--panel2);color:#fff}
nav a.on{background:linear-gradient(90deg,#1d4ed8,#22b8cf);color:#111}
nav a span:first-child{font-size:17px;width:22px;text-align:center;flex:none}
.foot{margin-top:auto;padding:14px 8px 0;color:var(--mut);font-size:12px}
main{position:relative;z-index:2;flex:1;min-width:0;height:100%;overflow-y:auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(6,13,27,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-weight:700}
.pg{padding:28px 24px 60px;max-width:1200px;margin:0 auto;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin-bottom:6px}
h2{font-size:18px;margin:30px 0 14px;color:var(--gold2)}
.sub{color:var(--mut);margin-bottom:22px;line-height:1.5}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:48vh}
.hero .logo svg{width:92px;height:92px;margin-bottom:10px}
.big{font-size:clamp(44px,9vw,92px);font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#fff,#67e8f9 55%,#1d4ed8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.search{display:flex;gap:8px;width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-size:16px;padding:0 12px;min-width:0}
.search select{background:var(--panel2);color:var(--txt);border:0;border-radius:999px;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
a.card{color:inherit;text-decoration:none;transition:.15s;display:block}
a.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .ic{font-size:26px;margin-bottom:8px}
.card b{display:block;margin-bottom:4px}
.card small{color:var(--mut);line-height:1.45;display:block}
.btn{background:linear-gradient(90deg,#1d4ed8,#22b8cf);color:#111;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
input,select,textarea{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{font-family:Consolas,monospace;font-size:13px;min-height:150px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);flex:1;min-width:140px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item code{word-break:break-all;font-size:13px;color:var(--gold2)}
.item a{color:var(--txt)}
pre{background:#050b17;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:13px;color:var(--gold2);margin:10px 0;white-space:pre-wrap;word-break:break-all}
iframe#pv{width:100%;height:340px;border:1px solid var(--line);border-radius:12px;background:#fff}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.num{font-size:clamp(48px,10vw,96px);font-weight:900;color:var(--gold2);text-align:center;line-height:1}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#67e8f9);transition:width .2s}
.stat{text-align:center}.stat b{display:block;font-size:24px;color:var(--gold2)}.stat small{color:var(--mut)}
.wp{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.wp img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.wp div{position:absolute;bottom:0;left:0;right:0;padding:8px;display:flex;gap:6px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:11px;word-break:break-all;text-align:center}
.ico:hover{border-color:var(--gold)}.ico img{width:36px;height:36px}
.tag{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--mut)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--gold);color:#111;font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
ul.tips{padding-left:20px;line-height:1.8;color:#d0d3d6}
#market-ticker{position:fixed;right:18px;bottom:18px;z-index:60;width:330px;border:1px solid #34434e;border-radius:12px;background:rgba(17,24,32,.97);box-shadow:0 16px 42px rgba(0,0,0,.45);overflow:hidden}
#market-ticker.market-minimized{width:142px}
#market-ticker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 10px;border-bottom:1px solid #263440}
#market-ticker-head a{color:#dce6ed;text-decoration:none;font-size:12px;font-weight:700}
#market-ticker-head a:hover{text-decoration:underline}
#market-ticker-status{display:flex;align-items:center;gap:6px;color:#91a0ad;font-size:10px}
#market-live-dot{width:7px;height:7px;border-radius:50%;background:#55b8d5;box-shadow:0 0 8px rgba(85,184,213,.7)}
#market-ticker-toggle{width:24px;height:24px;padding:0;border:1px solid #34434e;border-radius:6px;background:#111820;color:#dce6ed;cursor:pointer}
#market-ticker-toggle:hover{border-color:#55b8d5}
#market-ticker-body{padding:6px 8px 8px}
#market-ticker-list{display:grid;gap:3px}
.market-row{display:grid;grid-template-columns:82px 1fr 1fr 48px;align-items:center;gap:6px;min-height:30px;padding:5px 6px;border-radius:7px;background:#141d26}
.market-name{color:#dce6ed;font-size:11px;font-weight:650}
.market-buy,.market-sell{font-size:11px;color:#a6d9e8;text-align:right;white-space:nowrap}
.market-change{font-size:10px;text-align:right;white-space:nowrap;color:#86d3e8}
.market-change.negative{color:#ef8d8d}
.market-ticker-foot{display:flex;justify-content:space-between;align-items:center;margin-top:5px;color:#72818e;font-size:9px}
#market-ticker.market-minimized #market-ticker-status,#market-ticker.market-minimized #market-ticker-body{display:none}
#market-ticker.market-minimized #market-ticker-head{border-bottom:0}
@media(max-width:520px){
  #market-ticker{right:8px;bottom:8px;width:290px}
  #market-ticker.market-minimized{width:142px}
  .market-row{grid-template-columns:72px 1fr 1fr 44px}
}
@media(max-width:860px){
aside{position:fixed;left:0;top:0;bottom:0;margin-left:0!important}
body.nav-closed aside{transform:translateX(-100%)}
body:not(.nav-closed) #scrim{display:block}
.pg{padding:20px 16px 60px}
}
</style>

<script>
(() => {
  const ticker = document.getElementById("market-ticker");
  if (!ticker) return;
  const list = document.getElementById("market-ticker-list");
  const time = document.getElementById("market-ticker-time");
  const updated = document.getElementById("market-ticker-updated");
  const toggle = document.getElementById("market-ticker-toggle");
  const storageKey = "asi_market_minimized";
  let minimized = false;
  try { minimized = localStorage.getItem(storageKey) === "true"; } catch {}
  const applyMinimized = () => {
    ticker.classList.toggle("market-minimized", minimized);
    toggle.textContent = minimized ? "+" : "−";
    toggle.title = minimized ? "Genişlet" : "Küçült";
    toggle.setAttribute("aria-label", minimized ? "Piyasa panelini genişlet" : "Piyasa panelini küçült");
  };
  toggle.addEventListener("click", () => {
    minimized = !minimized;
    try { localStorage.setItem(storageKey, String(minimized)); } catch {}
    applyMinimized();
  });
  applyMinimized();

  const wanted = ["Gram Altın", "Çeyrek Altın", "Yarım Altın", "Tam Altın"];
  async function loadMarket() {
    time.textContent = "Güncelleniyor";
    try {
      const response = await fetch("https://canlidoviz.com/altin-fiyatlari/kapali-carsi", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      let target = null;
      for (const table of doc.querySelectorAll("table")) {
        const headers = Array.from(table.querySelectorAll("th")).map(th => th.textContent.trim());
        if (headers.some(header => header.includes("ALTIN ADI")) && headers.includes("ALIŞ FİYATI") && headers.includes("SATIŞ FİYATI")) {
          target = table;
          break;
        }
      }
      if (!target) throw new Error("Piyasa tablosu bulunamadı");

      const rows = [];
      for (const tr of target.querySelectorAll("tr")) {
        const cells = Array.from(tr.querySelectorAll("td")).map(td => td.textContent.trim());
        if (!cells.length) continue;
        const name = cells[0];
        if (!wanted.includes(name)) continue;
        rows.push({ name, buy: cells[1], sell: cells[2], change: cells[3] });
      }
      if (!rows.length) throw new Error("Altın fiyatları bulunamadı");

      list.innerHTML = [
        '<div class="market-row"><span class="market-name">Piyasa</span><span class="market-buy">Alış</span><span class="market-sell">Satış</span><span class="market-change">Değişim</span></div>',
        ...rows.map(row => {
          const negative = row.change.includes("-");
          return '<div class="market-row"><span class="market-name">' + row.name.replace(/</g, "&lt;") +
            '</span><span class="market-buy">' + row.buy.replace(/</g, "&lt;") +
            '</span><span class="market-sell">' + row.sell.replace(/</g, "&lt;") +
            '</span><span class="market-change' + (negative ? " negative" : "") + '">' + row.change.replace(/</g, "&lt;") + '</span></div>';
        })
      ].join("");

      const marketStatus = doc.body.textContent.match(/PİYASA:\s*(AÇIK|KAPALI)/i);
      time.textContent = marketStatus ? marketStatus[1].toUpperCase() : "CANLI";
      const now = new Date();
      updated.textContent = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    } catch (error) {
      time.textContent = "Bağlantı yok";
      updated.textContent = "Veri alınamadı";
      console.error("Kapalı Çarşı verisi alınamadı:", error);
    }
  }
  loadMarket();
  setInterval(loadMarket, 60000);
})();
</script>

const SETS={a:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',h:'0123456789abcdef',u:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'};
const rnd=(n,ch)=>{const out=[],max=Math.floor(256/ch.length)*ch.length;while(out.length<n){for(const x of crypto.getRandomValues(new Uint8Array(n*2))){if(x<max&&out.length<n)out.push(ch[x%ch.length])}}return out.join('')};
let googleIdentityServicePromise;
const loadGoogleIdentityService=()=>{
  if(window.google?.accounts?.oauth2)return Promise.resolve();
  if(!googleIdentityServicePromise){
    googleIdentityServicePromise=new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://accounts.google.com/gsi/client';
      script.async=true;
      script.onload=resolve;
      script.onerror=()=>reject(new Error('Google kimlik doğrulama servisi yüklenemedi.'));
      document.head.appendChild(script);
    });
  }
  return googleIdentityServicePromise;
};

<h2>Kayıtlı Anahtarlarım</h2><div class="card"><small style="color:var(--mut)">Anahtarlar varsayılan olarak bu tarayıcıda kalır. İstersen Google hesabınla izin verip Drive'daki özel bir JSON dosyasına eşitleyebilirsin. OAuth erişim tokenı saklanmaz.</small>
<div class="row" style="margin-top:12px"><label>Google OAuth Client ID<input id="drive-client-id" placeholder="...apps.googleusercontent.com" autocomplete="off"></label><button class="btn" id="drive-sync" type="button" disabled>Drive ile eşitle</button></div>
<details style="margin:8px 0 12px;color:var(--mut);font-size:12px"><summary>İlk bağlantı kurulumu</summary><ol class="tips"><li><a href="https://console.cloud.google.com/" target="_blank" rel="noopener noreferrer">Google Cloud Console</a>'da Google Drive API'yi etkinleştir.</li><li>OAuth istemci kimliği oluştur: türü Web uygulaması, yetkili JavaScript kaynağı <code>https://asikurt23.github.io</code>.</li><li>İstemci kimliğini yukarıya yapıştırıp Drive ile eşitle'ye bas ve Google izin penceresini onayla.</li></ol><small>Uygulama yalnızca kendisinin oluşturduğu dosyaya erişim ister (drive.file). Test modundaki OAuth uygulamasında hesabını test kullanıcısı olarak eklemen gerekebilir.</small></details>
<p id="drive-status" class="widget-note" role="status" aria-live="polite">Google Drive bağlantısı hazırlanıyor...</p>
<div class="row" style="margin-top:12px"><label>Ad<input id="kn" placeholder="Örn: Test API"></label><label>Anahtar<input id="kv"></label><button class="btn" id="ks">Kaydet</button></div><div class="list" id="kl"></div></div>`,()=>{
  const out=a=>$('#ao').innerHTML=a.map(k=>`<div class="item"><code>${esc(k)}</code><span><button class="btn sm" data-copy="${esc(k)}">Kopyala</button> <button class="btn ghost sm" data-use="${esc(k)}">Kullan</button></span></div>`).join('');
  $('#ag').onclick=()=>{const n=Math.min(20,Math.max(1,+$('#an').value||1)),l=Math.min(128,Math.max(8,+$('#al').value||32));out(Array.from({length:n},()=>$('#ap').value+rnd(l,SETS[$('#ac').value])))};
  $('#au').onclick=()=>out(Array.from({length:+$('#an').value||1},()=>crypto.randomUUID()));
  $('#ao').onclick=e=>{const b=e.target.closest('[data-use]');if(b){$('#kv').value=b.dataset.use;$('#kn').focus()}};
  const draw=()=>{const k=load('asi_keys',[]);$('#kl').innerHTML=k.map((x,i)=>`<div class="item"><span><b>${esc(x.n)}</b><br><code>${esc(x.v)}</code></span><span><button class="btn sm" data-copy="${esc(x.v)}">Kopyala</button> <button class="btn ghost sm" data-d="${i}">Sil</button></span></div>`).join('');
    $('#kl').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=load('asi_keys',[]);k.splice(+b.dataset.d,1);save('asi_keys',k);draw()})};
  const driveStatus=$('#drive-status');
  const driveButton=$('#drive-sync');
  const driveClientId=$('#drive-client-id');
  const driveFileName='aSiKuRT API Keys.json';
  driveClientId.value=load('asi_drive_client_id','');
  driveClientId.addEventListener('change',()=>{
    try{
      const clientId=driveClientId.value.trim();
      if(clientId)localStorage.setItem('asi_drive_client_id',JSON.stringify(clientId));
      else localStorage.removeItem('asi_drive_client_id');
    }catch(error){
      driveStatus.textContent='OAuth istemci kimliği tarayıcıya kaydedilemedi: '+error.message;
    }
  });
  const checkResponse=async(response,label)=>{
    if(response.ok)return;
    const detail=(await response.text()).slice(0,300);
    throw new Error(`${label}: HTTP ${response.status}${detail?` — ${detail}`:''}`);
  };
  const parseKeyList=(value,label)=>{
    if(!Array.isArray(value))throw new Error(`${label} anahtar listesi geçersiz.`);
    return value.map((item,index)=>{
      if(!item||typeof item.n!=='string'||typeof item.v!=='string'||!item.v.trim()){
        throw new Error(`${label} anahtar listesinde ${index+1}. kayıt geçersiz.`);
      }
      return {n:item.n,v:item.v};
    });
  };
  const getLocalKeys=()=>{
    let raw;
    try{raw=localStorage.getItem('asi_keys')}catch(error){throw new Error('Tarayıcıdaki anahtarlar okunamadı: '+error.message)}
    if(!raw)return [];
    try{return parseKeyList(JSON.parse(raw),'Tarayıcıdaki')}catch(error){
      if(error instanceof SyntaxError)throw new Error('Tarayıcıdaki anahtar listesi JSON biçiminde geçersiz.');
      throw error;
    }
  };
  const findDriveFile=async(token)=>{
    const params=new URLSearchParams({
      q:`name = '${driveFileName}' and mimeType = 'application/json' and trashed = false`,
      spaces:'drive',
      fields:'files(id,name)',
      pageSize:'10'
    });
    const response=await fetch(`https://www.googleapis.com/drive/v3/files?${params}`,{
      headers:{Authorization:'Bearer '+token}
    });
    await checkResponse(response,'Drive dosyası aranamadı');
    const data=await response.json();
    return data.files?.[0]||null;
  };
  const readDriveKeys=async(token,file)=>{
    const response=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`,{
      headers:{Authorization:'Bearer '+token}
    });
    await checkResponse(response,'Drive anahtarları okunamadı');
    let data;
    try{data=await response.json()}catch{throw new Error('Drive dosyasındaki JSON okunamadı.')}
    return parseKeyList(data,'Drive dosyasındaki');
  };
  const writeDriveKeys=async(token,file,keys)=>{
    const content=JSON.stringify(keys,null,2);
    let response;
    if(file){
      response=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(file.id)}?uploadType=media`,{
        method:'PATCH',
        headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:content
      });
    }else{
      const boundary='asikurt_'+crypto.randomUUID().replaceAll('-','');
      const body=[
        `--${boundary}`,
        'Content-Type: application/json; charset=UTF-8',
        '',
        JSON.stringify({name:driveFileName,mimeType:'application/json'}),
        `--${boundary}`,
        'Content-Type: application/json; charset=UTF-8',
        '',
        content,
        `--${boundary}--`,
        ''
      ].join('\r\n');
      response=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{
        method:'POST',
        headers:{Authorization:'Bearer '+token,'Content-Type':`multipart/related; boundary="${boundary}"`},
        body
      });
    }
    await checkResponse(response,'Drive dosyası kaydedilemedi');
  };
  const syncToDrive=async(token)=>{
    const localKeys=getLocalKeys();
    const file=await findDriveFile(token);
    const driveKeys=file?await readDriveKeys(token,file):[];
    const merged=new Map();
    [...driveKeys,...localKeys].forEach(item=>merged.set(item.v,item));
    const keys=[...merged.values()];
    await writeDriveKeys(token,file,keys);
    try{localStorage.setItem('asi_keys',JSON.stringify(keys))}catch(error){
      draw();
      driveStatus.textContent=`${keys.length} anahtar Drive'a kaydedildi; tarayıcı listesi güncellenemedi: ${error.message}`;
      return;
    }
    draw();
    driveStatus.textContent=`${keys.length} anahtar Drive'daki "${driveFileName}" dosyasıyla eşitlendi.`;
  };
  driveButton.addEventListener('click',()=>{
    const clientId=driveClientId.value.trim();
    if(!clientId){
      driveStatus.textContent='Önce Google OAuth Client ID girin.';
      driveClientId.focus();
      return;
    }
    if(!window.google?.accounts?.oauth2){
      driveStatus.textContent='Google bağlantısı henüz hazır değil; biraz bekleyip tekrar deneyin.';
      return;
    }
    driveButton.disabled=true;
    driveStatus.textContent='Google izin penceresi açılıyor...';
    try{
      const tokenClient=window.google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:async response=>{
          try{
            if(response.error)throw new Error(response.error_description||response.error);
            if(!response.access_token)throw new Error('Google erişim tokenı alınamadı.');
            await syncToDrive(response.access_token);
          }catch(error){
            driveStatus.textContent='Drive eşitleme hatası: '+error.message;
          }finally{
            driveButton.disabled=false;
          }
        },
        error_callback:error=>{
          driveStatus.textContent='Google izin penceresi açılamadı: '+(error.message||error.type||'Bilinmeyen hata');
          driveButton.disabled=false;
        }
      });
      tokenClient.requestAccessToken({prompt:'consent'});
    }catch(error){
      driveStatus.textContent='Google bağlantısı başlatılamadı: '+error.message;
      driveButton.disabled=false;
    }
  });
  loadGoogleIdentityService().then(()=>{
    driveButton.disabled=false;
    driveStatus.textContent='Drive eşitlemesi hazır. OAuth Client ID girip bağlanın.';
  }).catch(error=>{
    driveStatus.textContent=error.message;
  });
  $('#ks').onclick=()=>{if(!$('#kv').value.trim())return toast('Anahtar boş');const k=load('asi_keys',[]);k.push({n:$('#kn').value.trim()||'Adsız',v:$('#kv').value.trim()});save('asi_keys',k);$('#kn').value=$('#kv').value='';draw()};
  $('#ag').click();draw();
});};

/* ---------- M3U LİST ---------- */
const nameOf=l=>{
  const comma=l.indexOf(',');
  return comma>=0?l.slice(comma+1).trim():'İsimsiz';
};
const parseM3U=t=>{
  const out=[];let info=null;
  for(let l of t.replace(/\r\n?/g,'\n').split('\n')){
    l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){info=l;continue}
    if(/^#/.test(l))continue;
    if(!/^(https?|rtmp|rtsp):\/\//i.test(l)||!info)continue;
    let name=nameOf(info);
    const tvgName=info.match(/tvg-name="([^"]*)"/i)?.[1]?.trim();
    if(tvgName)name=tvgName;
    const attr=k=>info.match(new RegExp(k+'="([^"]*)"','i'))?.[1]||'';
    let raw=info;
    if(!/tvg-name\s*=/.test(raw))raw=raw.replace(/^(#EXTINF:[^ ]*)/,`$1 tvg-name="${name.replace(/"/g,'')}"`);
    if(!/group-title\s*=/.test(raw))raw=raw.replace(/^(#EXTINF:[^ ]*)/,`$1 group-title="${attr('group-title')||'Genel'}"`);
    out.push({name:name||'İsimsiz',group:attr('group-title')||'Genel',logo:attr('tvg-logo'),raw,url:l});
    info=null;
  }
  return out;
};

P.mp3cover=()=>{
let processed=[];
const synchsafe=n=>new Uint8Array([(n>>21)&127,(n>>14)&127,(n>>7)&127,n&127]);
const readSynchsafe=(bytes,offset)=>{
  return ((bytes[offset]&127)<<21)|((bytes[offset+1]&127)<<14)|((bytes[offset+2]&127)<<7)|(bytes[offset+3]&127);
};
const removeId3Cover=bytes=>{
  if(bytes.length<10)return{bytes,removed:false};
  const view=new Uint8Array(bytes);
  if(String.fromCharCode(view[0],view[1],view[2])!=='ID3')return{bytes,removed:false};
  const major=view[3],flags=view[4];
  const tagSize=readSynchsafe(view,6);
  const tagEnd=Math.min(view.length,10+tagSize+(flags&16?10:0));
  if(tagSize<1||tagEnd>view.length)return{bytes,removed:false};
  let offset=10;
  if(major>=3&&(flags&64)){
    const extSize=major===4?readSynchsafe(view,offset):view[offset]<<24|view[offset+1]<<16|view[offset+2]<<8|view[offset+3];
    offset+=major===4?4+(extSize||0):10+(extSize||0);
  }
  const kept=new Uint8Array(tagEnd-offset);
  let keptOffset=0,removed=false;
  while(offset<tagEnd){
    let frameId='',headerSize,frameSize;
    if(view[offset]===0)break;
    if(major===2){
      if(offset+6>tagEnd)break;
      frameId=String.fromCharCode(view[offset],view[offset+1],view[offset+2]);
      frameSize=(view[offset+3]<<16)|(view[offset+4]<<8)|view[offset+5];
      headerSize=6;
    }else{
      if(offset+10>tagEnd)break;
      frameId=String.fromCharCode(view[offset],view[offset+1],view[offset+2],view[offset+3]);
      frameSize=major===4?readSynchsafe(view,offset+4):((view[offset+4]<<24)|(view[offset+5]<<16)|(view[offset+6]<<8)|view[offset+7])>>>0;
      headerSize=10;
    }
    if(frameSize<0||offset+headerSize+frameSize>tagEnd)break;
    const frameEnd=offset+headerSize+frameSize;
    if(!((major===2&&frameId==='PIC')||(major>=3&&frameId==='APIC'))){
      kept.set(view.slice(offset,frameEnd),keptOffset);keptOffset+=frameEnd-offset;
    }else{
      removed=true;
    }
    offset=frameEnd;
  }
  if(offset<tagEnd){{const padding=view.slice(offset,tagEnd);kept.set(padding,keptOffset);keptOffset+=padding.length}}
  if(!removed)return{bytes,removed:false};
  const padding=Math.max(0,tagSize-keptOffset);
  const finalTagSize=keptOffset+padding;
  const header=new Uint8Array(10);
  header.set(view.slice(0,10));
  header.set(synchsafe(finalTagSize),6);
  const rest=view.slice(tagEnd);
  const out=new Uint8Array(header.length+keptOffset+padding+rest.length);
  out.set(header,0);out.set(kept.slice(0,keptOffset),10);
  if(padding)out.fill(0,10+keptOffset,10+finalTagSize);
  out.set(rest,10+finalTagSize);
  return{bytes:out.buffer,removed:true};
};

    const files=[...$('#mp3files').files].filter(file=>file.name.toLowerCase().endsWith('.mp3')||file.type==='audio/mpeg');
    $('#mp3count').textContent=files.length+' seçili';
    $('#mp3run').disabled=!files.length;
    $('#mp3all').disabled=true;
    $('#mp3list').innerHTML=files.map(file=>'<div class="item"><span><b>'+esc(file.name)+'</b><br><code>'+formatSize(file.size)+'</code></span><span class="tag">Bekliyor</span></div>').join('');
  };
  $('#mp3run').onclick=async()=>{
    const files=[...$('#mp3files').files].filter(file=>file.name.toLowerCase().endsWith('.mp3')||file.type==='audio/mpeg');
    if(!files.length)return toast('MP3 dosyası seç');
    const button=$('#mp3run');button.disabled=true;
    processed=[];
    $('#mp3list').replaceChildren();
    let removedCount=0;
    for(const file of files){
      const row=document.createElement('div');row.className='item';
      row.innerHTML='<span><b>'+esc(file.name)+'</b><br><code>İşleniyor...</code></span>';
      $('#mp3list').append(row);
      try{
        const source=await file.arrayBuffer();
        const result=removeId3Cover(source);
        if(result.removed)removedCount++;
        const outputName=file.name.replace(/\.mp3$/i,'')+'-kapaksiz.mp3';
        const blob=new Blob([result.bytes],{type:'audio/mpeg'});
        const url=URL.createObjectURL(blob);
        processed.push({name:outputName,blob,url});
        row.innerHTML='<span><b>'+esc(file.name)+'</b><br><code>'+esc(outputName)+' · '+(result.removed?'Kapak kaldırıldı':'Kapak bulunmadı')+'</code></span><button class="btn sm" data-mp3-download="'+(processed.length-1)+'">İndir</button>';
      }catch(error){
        row.innerHTML='<span><b>'+esc(file.name)+'</b><br><code>Hata: '+esc(error.message)+'</code></span>';
      }
    }
    $('#mp3all').disabled=!processed.length;
    toast(removedCount+' dosyadan kapak kaldırıldı');
    button.disabled=false;
  };
  $('#mp3list').onclick=e=>{
    const button=e.target.closest('[data-mp3-download]');
    if(!button)return;
    const item=processed[Number(button.dataset.mp3Download)];
    if(!item)return;
    const link=document.createElement('a');link.href=item.url;link.download=item.name;link.click();
  };
  $('#mp3all').onclick=()=>{
    processed.forEach((item,index)=>{
      setTimeout(()=>{const link=document.createElement('a');link.href=item.url;link.download=item.name;link.click()},index*150);
    });
  };
});};

P.speed=()=>{
page(hd('SPEED HIZ TESTİ','Cloudflare sunucularına karşı gerçek indirme, yükleme ve ping ölçümü.')+`<div class="card"><div class="num"><span id="sv">0</span><small style="font-size:18px;color:var(--mut)"> Mbps</small></div><div class="bar"><i id="sb"></i></div><p class="sub" id="sl" style="text-align:center">Hazır</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))"><div class="stat"><b id="rp">—</b><small>Ping (ms)</small></div><div class="stat"><b id="rj">—</b><small>Jitter (ms)</small></div><div class="stat"><b id="rd">—</b><small>İndirme (Mbps)</small></div><div class="stat"><b id="ru">—</b><small>Yükleme (Mbps)</small></div></div>
<div class="row" style="justify-content:center;margin:18px 0 0"><button class="btn" id="go">Testi başlat</button></div></div>`,()=>{
  const live=(v,p)=>{$('#sv').textContent=v.toFixed(1);if(p!=null)$('#sb').style.width=p+'%'};
  const lab=t=>$('#sl').textContent=t;
  const ping=async()=>{const t=[];for(let i=0;i<7;i++){const s=performance.now();await fetch('https://speed.cloudflare.com/__down?bytes=0&r='+Math.random(),{cache:'no-store'});if(i)t.push(performance.now()-s)}
    const m=[...t].sort((a,b)=>a-b)[Math.floor(t.length/2)];let j=0;for(let i=1;i<t.length;i++)j+=Math.abs(t[i]-t[i-1]);return[m,j/(t.length-1)]};
  const down=async()=>{const t0=performance.now();let got=0;const r=await fetch('https://speed.cloudflare.com/__down?bytes=60000000&r='+Math.random(),{cache:'no-store'});const rd=r.body.getReader();
    while(true){const{done,value}=await rd.read();if(done)break;got+=value.length;const s=(performance.now()-t0)/1000;if(s>.4)live(got*8/s/1e6,Math.min(100,s/8*100));if(s>8){rd.cancel();break}}
    return got*8/((performance.now()-t0)/1000)/1e6};
  const up=()=>new Promise((res,rej)=>{const size=8e6,t0=performance.now(),x=new XMLHttpRequest();x.open('POST','https://speed.cloudflare.com/__up?r='+Math.random());
    x.upload.onprogress=e=>{const s=(performance.now()-t0)/1000;if(s>.4)live(e.loaded*8/s/1e6,Math.min(100,e.loaded/size*100))};
    x.onload=()=>res(size*8/((performance.now()-t0)/1000)/1e6);x.onerror=()=>rej(new Error('up'));x.send(new Blob([new Uint8Array(size)]))});
  $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;['rp','rj','rd','ru'].forEach(i=>$('#'+i).textContent='—');live(0,0);
    try{lab('Ping ölçülüyor…');const[p,j]=await ping();$('#rp').textContent=p.toFixed(0);$('#rj').textContent=j.toFixed(1);
      lab('İndirme ölçülüyor…');const d=await down();$('#rd').textContent=d.toFixed(1);live(d,100);
      lab('Yükleme ölçülüyor…');live(0,0);try{const u=await up();$('#ru').textContent=u.toFixed(1);live(u,100)}catch(e){$('#ru').textContent='hata'}
      lab('Tamamlandı ✓')}catch(e){lab('Test yapılamadı. İnternet bağlantını kontrol et.')}b.disabled=false};
});};

  });
  (P[n.id]||P.ana)();trackPageView(n.t);$('main').scrollTop=0;
  if(closeMobileMenu&&innerWidth<=860)document.body.classList.add('nav-closed');
  $('#tog').setAttribute('aria-expanded',String(!document.body.classList.contains('nav-closed')));
}
$('#tog').onclick=()=>{
  document.body.classList.toggle('nav-closed');
  save('asi_nav_open',!document.body.classList.contains('nav-closed'));
  $('#tog').setAttribute('aria-expanded',String(!document.body.classList.contains('nav-closed')));
  if(!document.body.classList.contains('nav-closed')){
    const side=$('aside');
    document.documentElement.style.setProperty('--sidebar-open-width',(side.offsetWidth||172)+'px');
  }
};
const closeSide=()=>{
  document.body.classList.add('nav-closed');
  save('asi_nav_open',false);
  $('#tog').setAttribute('aria-expanded','false');
};
const sideClose=$('#side-close');
if(sideClose)sideClose.onclick=closeSide;
$('#scrim').onclick=()=>{
  document.body.classList.add('nav-closed');
  save('asi_nav_open',false);
  $('#tog').setAttribute('aria-expanded','false');
};
if(innerWidth>860){
  const side=$('aside');
  const brand=$('.brand');
  document.documentElement.style.setProperty('--sidebar-open-width',side.offsetWidth+'px');
  let drag=null;
  brand.onpointerdown=e=>{
    if(e.pointerType==='touch'&&e.target.closest('svg'))return;
    const rect=side.getBoundingClientRect();
    drag={mode:'move',dx:e.clientX-rect.left,dy:e.clientY-rect.top};
    brand.classList.add('dragging');
    brand.setPointerCapture(e.pointerId);
  };
  brand.onpointermove=e=>{
    if(!drag||drag.mode!=='move')return;
    const left=Math.min(innerWidth-side.offsetWidth,Math.max(0,e.clientX-drag.dx));
    const top=Math.min(innerHeight-side.offsetHeight,Math.max(0,e.clientY-drag.dy));
    side.style.left=left+'px';
    side.style.top=top+'px';
  };
  brand.onpointerup=()=>{drag=null;brand.classList.remove('dragging')};
  const resizer=$('#side-resizer');
  resizer.onpointerdown=e=>{
    drag={mode:'resize',x:e.clientX,width:side.offsetWidth};
    resizer.setPointerCapture(e.pointerId);
  };
  resizer.onpointermove=e=>{
    if(!drag||drag.mode!=='resize')return;
    const width=Math.min(220,Math.max(172,drag.width+(e.clientX-drag.x)));
    side.style.width=width+'px';
    document.documentElement.style.setProperty('--sidebar-open-width',width+'px');
  };
  resizer.onpointerup=()=>{drag=null};
}
addEventListener('hashchange',()=>route(true));
const savedBg=load('asi_bg','');if(savedBg)$('#bg').style.backgroundImage=`url("${savedBg}")`;
const storedNavOpen=load('asi_nav_open',null);
const navOpen=storedNavOpen===null?innerWidth>860:storedNavOpen;
document.body.classList.toggle('nav-closed',!navOpen);
route();
</script>

<script id="ek-js">
(function(){
  const q=s=>document.querySelector(s);
  document.addEventListener('keydown',e=>{
    const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'');
    if((e.key==='/'&&!typing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){
      e.preventDefault();
      if(!q('#q')){location.hash='#/ana';setTimeout(()=>q('#q')&&q('#q').focus(),200)}else q('#q').focus()}});
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
    addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=14',{updateViaCache:'none'}).then(registration=>registration.update()).catch(err=>console.error('Service worker kaydedilemedi:',err)));
  }
})();
</script>
